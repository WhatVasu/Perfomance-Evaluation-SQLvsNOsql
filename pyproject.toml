[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-vs-postgres-benchmark"
version = "0.1.0"
description = "A Performance Evaluation of MongoDB and PostgreSQL Using an Identical E-Commerce Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "locust>=2.31.0",
    "psutil>=6.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "faker>=28.0.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
